<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTAS Bot Simulator</title>
<style>
  :root {
    --bg: #0e1621;
    --panel: #17212b;
    --bubble-bot: #223140;
    --bubble-user: #2b5278;
    --text: #e9edf1;
    --muted: #7d8b99;
    --accent: #4ea1e0;
    --btn-bg: #2b3a49;
    --btn-hover: #35485c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid #0a0f15;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header .title { font-weight: 600; }
  header .subtitle { font-size: 12px; color: var(--muted); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }
  .row.system { justify-content: center; }

  .bubble {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 12px;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14.5px;
    line-height: 1.45;
  }
  .bot .bubble { background: var(--bubble-bot); border-top-left-radius: 3px; }
  .user .bubble { background: var(--bubble-user); border-top-right-radius: 3px; }
  .system .bubble {
    background: transparent; color: var(--muted); font-size: 12px;
    padding: 2px 8px;
  }

  .bot-wrap { display: flex; flex-direction: column; gap: 6px; max-width: 78%; }
  .buttons { display: flex; flex-direction: column; gap: 6px; }
  .buttons button {
    background: var(--btn-bg);
    color: var(--accent);
    border: 1px solid #33445770;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
  }
  .buttons button:hover { background: var(--btn-hover); }
  .buttons button:disabled { opacity: 0.4; cursor: default; }

  #quickbar {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    overflow-x: auto;
    background: var(--panel);
    border-top: 1px solid #0a0f15;
    flex-shrink: 0;
  }
  #quickbar button {
    background: var(--btn-bg);
    color: var(--text);
    border: none;
    border-radius: 14px;
    padding: 6px 12px;
    font-size: 12.5px;
    white-space: nowrap;
    cursor: pointer;
  }
  #quickbar button:hover { background: var(--btn-hover); }

  #composer {
    display: flex;
    gap: 8px;
    padding: 10px 12px 14px;
    background: var(--panel);
    flex-shrink: 0;
  }
  #composer input {
    flex: 1;
    background: #0e1621;
    border: 1px solid #2a3a49;
    color: var(--text);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14.5px;
    outline: none;
  }
  #composer input:focus { border-color: var(--accent); }
  #composer button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #composer button:hover { filter: brightness(1.08); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3a49; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="avatar">🏠</div>
  <div>
    <div class="title">PTAS Billing Bot</div>
    <div class="subtitle">local simulator — same HandleUpdate() code path as real Telegram</div>
  </div>
</header>

<div id="log"></div>

<div id="quickbar">
  <button data-cmd="/help">/help</button>
  <button data-cmd="/rooms">/rooms</button>
  <button data-cmd="/newmonth 2026-08">/newmonth 2026-08</button>
  <button data-cmd="/billing">/billing</button>
  <button data-cmd="/unpaid">/unpaid</button>
  <button data-cmd="/cancel">/cancel</button>
</div>

<div id="composer">
  <input id="input" type="text" placeholder="Type a command or a meter reading…" autocomplete="off">
  <button id="send">Send</button>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');

function scrollDown() {
  log.scrollTop = log.scrollHeight;
}

function addUserBubble(text) {
  const row = document.createElement('div');
  row.className = 'row user';
  row.innerHTML = '<div class="bubble"></div>';
  row.querySelector('.bubble').textContent = text;
  log.appendChild(row);
  scrollDown();
}

function addSystemNote(text) {
  const row = document.createElement('div');
  row.className = 'row system';
  row.innerHTML = '<div class="bubble"></div>';
  row.querySelector('.bubble').textContent = text;
  log.appendChild(row);
  scrollDown();
}

function addBotMessage(msg) {
  const row = document.createElement('div');
  row.className = 'row bot';

  const wrap = document.createElement('div');
  wrap.className = 'bot-wrap';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = msg.text;
  wrap.appendChild(bubble);

  if (msg.buttons && msg.buttons.length) {
    const btnWrap = document.createElement('div');
    btnWrap.className = 'buttons';
    msg.buttons.forEach(b => {
      const btn = document.createElement('button');
      btn.textContent = b.label;
      btn.addEventListener('click', () => {
        Array.from(btnWrap.children).forEach(x => x.disabled = true);
        addSystemNote('tapped: ' + b.label);
        sendCallback(b.data);
      });
      btnWrap.appendChild(btn);
    });
    wrap.appendChild(btnWrap);
  }

  row.appendChild(wrap);
  log.appendChild(row);
  scrollDown();
}

async function renderReply(resp) {
  const data = await resp.json();
  if (data.error) {
    addSystemNote('error: ' + data.error);
    return;
  }
  (data.messages || []).forEach(addBotMessage);
}

async function sendText(text) {
  addUserBubble(text);
  const resp = await fetch('/sim/message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  });
  await renderReply(resp);
}

async function sendCallback(data) {
  const resp = await fetch('/sim/callback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ data })
  });
  await renderReply(resp);
}

document.getElementById('send').addEventListener('click', () => {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendText(text);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('send').click();
});

document.getElementById('quickbar').addEventListener('click', e => {
  const cmd = e.target.getAttribute('data-cmd');
  if (cmd) sendText(cmd);
});

addSystemNote('Simulated chat as the bot owner, in a private chat. Try /help to start.');
</script>

</body>
</html>
